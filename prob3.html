<!DOCTYPE html>
<html lang="en">
<head>
  <title>Product Bill</title>
  <style>
    table {
      border: 2px solid black;
      background-color: aqua;
      border-collapse: collapse;
    }

    th, td {
      border: 2px solid black;
      padding: 10px;
    }

    tr:first-child {
      background-color: red;
      color: white;
    }

    tr:last-child {
      background-color: yellow;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <table>
    <tr>
      <th>Product</th>
      <th>Price</th>
      <th>Quantity</th>
      <th>Total</th>
    </tr>
    <tr>
      <td>iPhone 14</td>
      <td>80000</td>
      <td>1</td>
      <td>80000</td>
    </tr>
    <tr>
      <td>iPad Air</td>
      <td>60000</td>
      <td>1</td>
      <td>60000</td>
    </tr>
    <tr>
      <td>MacBook Air M1</td>
      <td>90000</td>
      <td>1</td>
      <td>90000</td>
    </tr>
    <tr>
      <td>AirPods</td>
      <td>20000</td>
      <td>2</td>
      <td>40000</td>
    </tr>
    <tr>
      <td>Apple Watch</td>
      <td>30000</td>
      <td>1</td>
      <td>30000</td>
    </tr>
    <tr>
      <td></td>
      <td></td>
      <td></td>
      <td>3,00,000</td>
    </tr>
  </table>

</body>
</html>
