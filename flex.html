<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex html</title>
    <style>
        .flex-container{
            border: 2px solid rebeccapurple;
            display: flex;
          
        }
        .box{
            flex-grow: 2;
            background-color: aqua;
            width: 200px;
            height: 200px;

        }
        .box-2{
            flex-grow: 4;
            background-color: red;
            width: 200px;}
        .box-3{
                background-color: beige;
                width: 200px;
                flex-grow: 6;
            }
    </style>
</head>
<body>
    <div class="flex-container">
        <div class="box" ></div>
        <div class="box-2"></div>
        <div class="box-3"></div>
    </div>
   
    
</body>
</html>
